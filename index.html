<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OpenClaw Pet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
            user-select: none;
            font-family: "PingFang SC", "SF Pro Rounded", sans-serif;
        }
        #pet-area {
            width: 100%; height: 100%;
            position: relative;
            cursor: grab;
        }
        #pet-area:active { cursor: grabbing; }
        #canvas-wrap {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        /* 输入框 — 居中在猫下方 */
        #chat-bar {
            position: absolute;
            bottom: 22px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 10;
        }
        #chat-bar.show { opacity: 1; pointer-events: auto; }
        #chat-bar-inner {
            display: flex;
            align-items: stretch;
        }
        #chat-input {
            width: 230px;
            padding: 6px 10px;
            border: 2px solid #ccc;
            border-right: none;
            background: rgba(255,255,255,0.95);
            color: #333;
            font-size: 12px;
            font-family: "PingFang SC", sans-serif;
            outline: none;
            border-radius: 0;
            resize: none;
            line-height: 1.4;
            max-height: 60px;
            overflow-y: auto;
        }
        #chat-input::placeholder { color: #bbb; }
        #chat-input:focus { border-color: #b3a0e6; }
        #chat-input:focus + #send-btn { border-color: #b3a0e6; }
        #send-btn {
            padding: 0 14px;
            border: 2px solid #ccc;
            background: rgba(255,255,255,0.95);
            color: #7c3aed;
            font-size: 12px;
            font-weight: 600;
            font-family: "PingFang SC", sans-serif;
            cursor: pointer;
            border-radius: 0;
            letter-spacing: 2px;
        }
        #send-btn:hover { background: #f8f5ff; }
        #send-btn.loading { color: #bbb; cursor: wait; }

        /* 录音指示：猫咪旁边的小圆点动画 */
        #rec-dot {
            position: absolute;
            display: none;
            z-index: 20;
        }
        #rec-dot.show { display: block; }
        #rec-dot svg { width: 24px; height: 24px; }
        @keyframes recPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.4); opacity: 0.4; }
        }
        #rec-dot .pulse-ring {
            animation: recPulse 1.2s ease-in-out infinite;
            transform-origin: center;
        }

        /* DOM 详细内容面板 */
        #dom-bubble-overlay {
            display: none;
            position: absolute;
            left: 6px; right: 6px; top: 6px;
            bottom: 60px;
            background: rgba(248,248,250,0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            z-index: 50;
            opacity: 0;
            transition: opacity 0.15s;
            flex-direction: column;
            overflow: hidden;
        }
        #dom-bubble-overlay.show {
            display: flex;
            opacity: 1;
        }
        .detail-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 6px;
            border-bottom: 0.5px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .detail-title { font-size: 11px; font-weight: 600; color: #888; }
        .detail-close {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ff5f57; border: 0.5px solid rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .detail-close:hover { background: #ff3b30; }
        #dom-bubble-text {
            padding: 10px 12px 12px;
            overflow-y: auto;
            flex: 1;
            font-size: 12px;
            line-height: 1.6;
            color: #333;
            font-family: "PingFang SC","SF Pro Text",system-ui,sans-serif;
            user-select: text;
            cursor: text;
            word-break: break-word;
        }
        #dom-bubble-text::-webkit-scrollbar { width: 3px; }
        #dom-bubble-text::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

        /* 对话历史面板 */
        #history-panel {
            display: none;
            position: absolute;
            left: 50%; top: 10px;
            transform: translateX(-50%);
            width: 360px;
            max-height: 350px;
            overflow-y: auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(180,180,190,0.5);
            border-radius: 14px;
            padding: 12px 0;
            z-index: 60;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        #history-panel.show { display: block; }
        #history-panel::-webkit-scrollbar { width: 4px; }
        #history-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
        .hist-title {
            font-size: 12px; font-weight: 600; color: #7c3aed;
            padding: 0 14px 8px; border-bottom: 1px solid #eee;
        }
        .hist-item {
            padding: 8px 14px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 11px; color: #333; line-height: 1.5;
        }
        .hist-item:last-child { border-bottom: none; }
        .hist-item[data-idx]:hover { background: #f8f5ff; }
        .hist-q { color: #7c3aed; font-weight: 500; }
        .hist-a { color: #555; margin-top: 2px; }
        .hist-time { color: #bbb; font-size: 10px; float: right; }
        .hist-empty { text-align: center; color: #bbb; padding: 20px; font-size: 12px; }

        /* 番茄钟浮层 */
        #timer-display {
            display: none;
            position: absolute;
            right: 8px; top: 8px;
            background: rgba(124,58,237,0.9);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            font-family: "SF Mono", "Menlo", monospace;
            padding: 4px 10px;
            border-radius: 8px;
            z-index: 30;
            cursor: pointer;
        }
        #timer-display.show { display: block; }

        /* markdown 渲染样式 */
        #dom-bubble-text h3, #dom-bubble-text h4 {
            font-size: 12px; font-weight: 600; color: #7c3aed;
            margin: 8px 0 4px;
        }
        #dom-bubble-text h3:first-child { margin-top: 0; }
        #dom-bubble-text p { margin: 4px 0; }
        #dom-bubble-text strong { font-weight: 600; color: #222; }
        #dom-bubble-text ul, #dom-bubble-text ol {
            margin: 4px 0; padding-left: 18px;
        }
        #dom-bubble-text li { margin: 2px 0; }
    </style>
</head>
<body>
    <div id="pet-area">
        <div id="canvas-wrap"></div>
        <div id="rec-dot">
            <svg viewBox="0 0 24 24">
                <circle class="pulse-ring" cx="12" cy="12" r="8" fill="#e44" opacity="0.3"/>
                <circle cx="12" cy="12" r="5" fill="#e44"/>
            </svg>
        </div>
        <div id="dom-bubble-overlay">
            <div class="detail-toolbar">
                <div class="detail-close" onclick="hideDomOverlay()"></div>
                <span class="detail-title">详细内容</span>
                <span style="width:12px"></span>
            </div>
            <div id="dom-bubble-text"></div>
        </div>
        <div id="history-panel"></div>
        <div id="timer-display" onclick="cancelTimer()" title="点击取消"></div>
        <div id="chat-bar">
            <div id="chat-bar-inner">
                <textarea id="chat-input" rows="1" placeholder="跟喵喵说..."></textarea>
                <button id="send-btn" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>

    <!-- 右键菜单改用 Electron 原生 Menu -->

    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <script>
    const { Live2DModel } = PIXI.live2d;
    const DPR = window.devicePixelRatio || 1;
    const CW = 400, CH = 420;

    const CATS = [
        { id: 'blue', name: '蓝粉猫团', path: '蓝粉猫团/蓝粉猫团/CAT102/CAT102.model3.json', watermark: 'Param12' },
        { id: 'black', name: '黑白猫团', path: '黑白猫团/黑白猫团/CAT101/CAT101.model3.json', watermark: 'Param12' },
    ];
    let catIdx = 0, model = null, pixiApp = null;
    let animating = false, isTop = true, chatBusy = false;
    let bubbleContainer = null, bubbleTimer = null;
    let lastFullText = '', chatBarTimer = null;
    let streamingText = ''; // 流式累积文本

    const meowAudio = new Audio('meow.mp3');
    meowAudio.volume = 0.5;
    function playMeow() { meowAudio.currentTime = 0; meowAudio.play().catch(() => {}); }

    const purrAudio = new Audio('purr.mp3');
    purrAudio.volume = 0.3;
    function playPurr() { purrAudio.currentTime = 0; purrAudio.play().catch(() => {}); }

    // ==================== 初始化 ====================
    async function init() {
        pixiApp = new PIXI.Application({
            width: CW*DPR, height: CH*DPR, backgroundAlpha: 0, antialias: true,
        });
        pixiApp.view.style.width = CW+'px';
        pixiApp.view.style.height = CH+'px';
        document.getElementById('canvas-wrap').appendChild(pixiApp.view);
        setupDrag(); setupContextMenu(); setupKeyboard();
        setupChatBarVisibility(); setupStreamListeners(); setupVoice();
        setupChatFocus(); setupErrorListeners();
        await loadCat(0);
        startIdleBehavior();
        showGreeting();
        initMood();
    }

    // ==================== 模型 ====================
    async function loadCat(idx) {
        if (model) { pixiApp.stage.removeChild(model); model.destroy(); }
        clearAllBubbles();
        const cat = CATS[idx];
        model = await Live2DModel.from(cat.path, { autoInteract: true });
        const origW = model.width, origH = model.height;
        const scale = Math.min((CW*DPR*0.7)/origW, (CH*DPR*0.45)/origH);
        model.scale.set(scale);
        model.x = (CW*DPR - origW*scale) / 2;
        model.y = (CH*DPR - origH*scale) / 2 + 10*DPR;
        if (cat.watermark) model.internalModel.coreModel.setParameterValueById(cat.watermark, 1);
        model.interactive = true;
        model.on('pointerdown', () => { if(!animating) bounceAction(); recordInteraction(); });
        pixiApp.stage.addChild(model);
        catIdx = idx;
        updateRecDotPos();
    }
    function switchCat() { loadCat((catIdx+1)%CATS.length); hideCtxMenu(); }

    // ==================== 录音小圆点位置 ====================
    function updateRecDotPos() {
        const dot = document.getElementById('rec-dot');
        if (model) {
            const catRight = (model.x + model.width * model.scale.x) / DPR;
            const catTop = model.y / DPR;
            dot.style.left = (catRight - 10) + 'px';
            dot.style.top = (catTop + 5) + 'px';
        }
    }

    // ==================== 输入框显隐 ====================
    let mouseInside = false;
    function setupChatBarVisibility() {
        const area = document.getElementById('pet-area');
        // 鼠标移动时显示，停止移动后自动隐藏
        area.addEventListener('mousemove', () => {
            mouseInside = true;
            clearTimeout(chatBarTimer);
            document.getElementById('chat-bar').classList.add('show');
            scheduleChatBarHide(2500);
        });
        area.addEventListener('mouseleave', () => {
            mouseInside = false;
            scheduleChatBarHide(500);
        });
    }
    function scheduleChatBarHide(delay) {
        clearTimeout(chatBarTimer);
        chatBarTimer = setTimeout(() => {
            if (document.activeElement === document.getElementById('chat-input')) return;
            if (chatBusy) return; // 对话中不隐藏
            mouseInside = false;
            document.getElementById('chat-bar').classList.remove('show');
        }, delay);
    }

    // ==================== 等待状态 ====================
    let waitTimers = [];
    const WAIT_STAGES = [
        { delay: 0, text: '想想' },
        { delay: 3000, text: '想想...' },
        { delay: 10000, text: '认真想...' },
        { delay: 20000, text: '这个比较难喵...' },
        { delay: 45000, text: '太难了...点击取消？', cancelable: true },
    ];

    function showWaitingBubble() {
        clearWaitTimers();
        showBubbleWithDots('想想');
        WAIT_STAGES.forEach((stage, i) => {
            if (i === 0) return;
            const t = setTimeout(() => {
                if (!chatBusy) return;
                updateBubbleText(stage.text);
            }, stage.delay);
            waitTimers.push(t);
        });
    }

    function clearWaitTimers() {
        waitTimers.forEach(t => clearTimeout(t));
        waitTimers = [];
    }

    function showBubbleWithDots(text) {
        clearAllBubbles();
        // 创建带跳动圆点的等待气泡
        bubbleContainer = createWaitingBubble(text, 340);
        bubbleContainer.x = CW * DPR / 2;
        if (model) bubbleContainer.y = model.y - 10*DPR;
        bubbleContainer.scale.set(0); bubbleContainer.alpha = 0;
        pixiApp.stage.addChild(bubbleContainer);
        animateBubbleIn(bubbleContainer);
        // 等待气泡不自动消失
    }

    function createWaitingBubble(text, maxWidth) {
        const c = new PIXI.Container(), px = 3*DPR;
        const maxW = Math.min(maxWidth * DPR, (CW - 60) * DPR);
        const wrapW = maxW - 28 * DPR;

        // 文字部分
        const ts = new PIXI.TextStyle({fontFamily:'"PingFang SC","SF Pro Rounded",sans-serif',fontSize:13*DPR,fontWeight:'500',fill:'#333',wordWrap:true,wordWrapWidth:wrapW,breakWords:true,align:'center',lineHeight:19*DPR});
        const textObj = new PIXI.Text(text, ts);
        textObj.anchor.set(0.5, 0.5);
        textObj.name = 'waitText';

        // 三个跳动圆点
        const dotsContainer = new PIXI.Container();
        dotsContainer.name = 'dots';
        const dotR = 3 * DPR;
        const dotGap = 10 * DPR;
        for (let i = 0; i < 3; i++) {
            const dot = new PIXI.Graphics();
            dot.beginFill(0x7c3aed);
            dot.drawCircle(0, 0, dotR);
            dot.endFill();
            dot.x = (i - 1) * dotGap;
            dot.y = 0;
            dot._baseY = 0;
            dot._phase = i * 0.3;
            dotsContainer.addChild(dot);
        }

        const w = maxW, h = Math.max(48*DPR, 56*DPR);
        const g = new PIXI.Graphics();
        g.beginFill(0xffffff); g.drawRect(-w/2+px,-h/2,w-px*2,h); g.drawRect(-w/2,-h/2+px,w,h-px*2); g.endFill();
        g.beginFill(0xcccccc);
        g.drawRect(-w/2+px,-h/2-px,w-px*2,px); g.drawRect(-w/2+px,h/2,w-px*2,px);
        g.drawRect(-w/2-px,-h/2+px,px,h-px*2); g.drawRect(w/2,-h/2+px,px,h-px*2);
        g.endFill();
        // 尾巴
        g.beginFill(0xffffff);
        g.drawRect(-px,h/2,px*3,px);g.drawRect(0,h/2+px,px*2,px);g.drawRect(px,h/2+px*2,px,px);
        g.endFill();
        g.beginFill(0xcccccc);
        g.drawRect(-px*2,h/2,px,px);g.drawRect(-px,h/2+px,px,px);g.drawRect(0,h/2+px*2,px,px);
        g.drawRect(px,h/2+px*3,px,px);g.drawRect(px*2,h/2+px*2,px,px);g.drawRect(px*3,h/2+px,px,px);g.drawRect(px*4,h/2,px,px);
        g.endFill();

        textObj.x = -20 * DPR;
        dotsContainer.x = textObj.x + textObj.width/2 + 16*DPR;

        c.addChild(g); c.addChild(textObj); c.addChild(dotsContainer);

        // 圆点跳动动画（用 ticker 驱动）
        const ticker = (delta) => {
            const time = performance.now() / 1000;
            dotsContainer.children.forEach(dot => {
                dot.y = dot._baseY + Math.sin((time + dot._phase) * 4) * 4 * DPR;
            });
        };
        pixiApp.ticker.add(ticker);
        c._dotTicker = ticker;

        return c;
    }

    function updateBubbleText(newText) {
        if (!bubbleContainer) return;
        const textObj = bubbleContainer.children.find(c => c.name === 'waitText');
        if (textObj) textObj.text = newText;
    }

    // ==================== 像素风气泡 ====================
    function showBubble(text) {
        clearAllBubbles(); hideDomOverlay(); lastFullText = text;
        const maxChars = 54;
        const isLong = text.length > maxChars;
        const displayText = isLong ? text.substring(0, maxChars-2)+'..▸' : text;
        bubbleContainer = createPixelBubble(displayText, 340);
        if (isLong) {
            bubbleContainer.interactive = true; bubbleContainer.cursor = 'pointer';
            bubbleContainer.on('pointertap', () => showDomOverlay(lastFullText));
            bubbleContainer.on('pointerover', () => { bubbleContainer.cursor = 'pointer'; });
        }
        bubbleContainer.x = CW * DPR / 2;
        if (model) bubbleContainer.y = model.y - 10*DPR;
        bubbleContainer.scale.set(0); bubbleContainer.alpha = 0;
        pixiApp.stage.addChild(bubbleContainer);
        animateBubbleIn(bubbleContainer);
        bubbleTimer = setTimeout(() => fadeBubble(bubbleContainer, ()=>{bubbleContainer=null;}), 8000);
    }

    // ==================== DOM 长文本浮层 ====================
    function showDomOverlay(text) {
        // 隐藏像素气泡
        if (bubbleContainer && bubbleContainer.parent) {
            bubbleContainer.visible = false;
        }
        if (bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
        document.getElementById('dom-bubble-text').innerHTML = renderMarkdown(text);
        document.getElementById('dom-bubble-overlay').classList.add('show');
    }

    function renderMarkdown(text) {
        let html = escHtml(text);
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/^[-–] (.+)$/gm, '<li>$1</li>');
        html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
        html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
        html = html.split('\n\n').map(p => {
            p = p.trim();
            if (!p || p.startsWith('<h') || p.startsWith('<ul')) return p;
            return '<p>' + p + '</p>';
        }).join('');
        html = html.replace(/([^>])\n([^<])/g, '$1<br>$2');
        return html;
    }
    function hideDomOverlay() {
        document.getElementById('dom-bubble-overlay').classList.remove('show');
    }

    // ==================== 流式气泡更新 ====================
    function showStreamingBubble(text) {
        lastFullText = text;
        const maxChars = 54;
        const displayText = text.length > maxChars ? text.substring(text.length - maxChars) : text;

        if (!bubbleContainer || bubbleContainer._isWaiting) {
            // 从等待气泡切换到内容气泡
            clearAllBubbles();
            bubbleContainer = createPixelBubble(displayText, 340);
            bubbleContainer._isStreaming = true;
            bubbleContainer.x = CW * DPR / 2;
            if (model) bubbleContainer.y = model.y - 10*DPR;
            pixiApp.stage.addChild(bubbleContainer);
            bubbleContainer.scale.set(1); bubbleContainer.alpha = 1;
        } else {
            // 更新已有气泡的文字
            const textChild = bubbleContainer.children.find(c => c instanceof PIXI.Text);
            if (textChild) textChild.text = displayText;
        }
    }

    function createPixelBubble(text, maxWidth) {
        const c=new PIXI.Container(), px=3*DPR;
        const maxW = Math.min(maxWidth * DPR, (CW - 60) * DPR);
        const wrapW = maxW - 28 * DPR;
        const ts=new PIXI.TextStyle({fontFamily:'"PingFang SC","SF Pro Rounded",sans-serif',fontSize:13*DPR,fontWeight:'500',fill:'#333',wordWrap:true,wordWrapWidth:wrapW,breakWords:true,align:'center',lineHeight:19*DPR});
        const t=new PIXI.Text(text,ts); t.anchor.set(0.5);
        const w=maxW, h=Math.max(t.height+18*DPR, 48*DPR);
        const g=new PIXI.Graphics();
        g.beginFill(0xffffff); g.drawRect(-w/2+px,-h/2,w-px*2,h); g.drawRect(-w/2,-h/2+px,w,h-px*2); g.endFill();
        g.beginFill(0xcccccc);
        g.drawRect(-w/2+px,-h/2-px,w-px*2,px); g.drawRect(-w/2+px,h/2,w-px*2,px);
        g.drawRect(-w/2-px,-h/2+px,px,h-px*2); g.drawRect(w/2,-h/2+px,px,h-px*2);
        g.endFill();
        g.beginFill(0xffffff);
        g.drawRect(-px,h/2,px*3,px);g.drawRect(0,h/2+px,px*2,px);g.drawRect(px,h/2+px*2,px,px);
        g.endFill();
        g.beginFill(0xcccccc);
        g.drawRect(-px*2,h/2,px,px);g.drawRect(-px,h/2+px,px,px);g.drawRect(0,h/2+px*2,px,px);
        g.drawRect(px,h/2+px*3,px,px);g.drawRect(px*2,h/2+px*2,px,px);g.drawRect(px*3,h/2+px,px,px);g.drawRect(px*4,h/2,px,px);
        g.endFill();
        c.addChild(g); c.addChild(t); return c;
    }

    function animateBubbleIn(target) {
        animate(300,t=>{const e=t<0.6?(t/0.6)**2*1.15:1+(1-(t-0.6)/0.4)*0.15*Math.sin((t-0.6)*Math.PI/0.4);target.scale.set(Math.min(e,1.05));target.alpha=Math.min(t*4,1);});
    }
    function fadeBubble(target,cb){animate(250,t=>{target.alpha=1-t;target.scale.set(1-t*0.2);},()=>{if(target.parent)pixiApp.stage.removeChild(target);target.destroy({children:true});cb?.();});}
    function clearAllBubbles(){
        if(bubbleTimer){clearTimeout(bubbleTimer);bubbleTimer=null;}
        clearWaitTimers();
        const toRemove = [];
        pixiApp.stage.children.forEach(c => {
            if(c !== model) {
                if (c._dotTicker) pixiApp.ticker.remove(c._dotTicker);
                toRemove.push(c);
            }
        });
        toRemove.forEach(c => { pixiApp.stage.removeChild(c); c.destroy({children:true}); });
        bubbleContainer = null;

    // ==================== 语音输入 ====================
    let mediaRecorder=null, audioChunks=[], isRecording=false;
    function setupVoice() { window.openclaw.onVoiceToggle(()=>toggleVoice()); }

    function toggleVoice() {
        if (chatBusy) return;

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRecorder = new MediaRecorder(stream,{mimeType:'audio/webm'});
            audioChunks=[];
            mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
            mediaRecorder.onstop = async()=>{
                stream.getTracks().forEach(t=>t.stop());
                document.getElementById('rec-dot').classList.remove('show');
                isRecording=false;

                // 立刻进入等待状态（和文本输入一致）
                chatBusy=true;
                streamingText='';
                document.getElementById('send-btn').classList.add('loading');
                document.getElementById('send-btn').textContent='..';
                showWaitingBubble();
                updateBubbleText('识别语音中...');

                try {
                    const blob=new Blob(audioChunks,{type:'audio/webm'});
                    const ab=await blob.arrayBuffer();
                    // 解码 + 重采样到 16kHz
                    let ctx;
                    let buf16k;
                    try {
                        ctx = new AudioContext();
                        const decoded = await ctx.decodeAudioData(ab.slice(0)); // slice 避免 detach
                        if (decoded.sampleRate !== 16000) {
                            const samples = Math.ceil(decoded.duration * 16000);
                            const offCtx = new OfflineAudioContext(1, samples, 16000);
                            const src = offCtx.createBufferSource();
                            src.buffer = decoded;
                            src.connect(offCtx.destination);
                            src.start();
                            buf16k = await offCtx.startRendering();
                        } else {
                            buf16k = decoded;
                        }
                    } finally {
                        if (ctx) ctx.close().catch(()=>{});
                    }
                    const wav=audioBufferToWav(buf16k);
                    const b64=uint8ToBase64(new Uint8Array(wav));
                    const r=await window.openclaw.asrRecognize(b64);

                    if(r.text&&r.text.trim()){
                        pendingQuestion=r.text.trim();
                        lastFailedMessage=r.text.trim();
                        updateBubbleText('想想');
                        window.openclaw.chatStream(r.text.trim());
                        recordInteraction();
                        changeMood(3);
                    } else {
                        chatBusy=false;
                        clearWaitTimers();
                        document.getElementById('send-btn').classList.remove('loading');
                        document.getElementById('send-btn').textContent='发送';
                        showBubble(r.error ? '语音识别出错了 >_<' : '没听清喵？再试~');
                    }
                } catch(e) {
                    console.error('语音处理错误:', e);
                    chatBusy=false;
                    clearWaitTimers();
                    document.getElementById('send-btn').classList.remove('loading');
                    document.getElementById('send-btn').textContent='发送';
                    showBubble('语音出错: ' + (e.message || e).toString().substring(0, 60));
                }
            };
            mediaRecorder.start(); isRecording=true;
            updateRecDotPos();
            document.getElementById('rec-dot').classList.add('show');
        } catch(e) {
            console.error('麦克风错误:', e);
            showBubble('无法访问麦克风 >_<');
        }
    }
    function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();}

    function uint8ToBase64(bytes) {
        let str = '';
        const chunk = 8192;
        for (let i = 0; i < bytes.length; i += chunk) {
            str += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(str);
    }

    function audioBufferToWav(buffer){
        const s=buffer.getChannelData(0),buf=new ArrayBuffer(44+s.length*2),v=new DataView(buf);
        function w(o,str){for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));}
        w(0,'RIFF');v.setUint32(4,36+s.length*2,true);w(8,'WAVE');w(12,'fmt ');
        v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
        v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*2,true);
        v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,s.length*2,true);
        let o=44;for(let i=0;i<s.length;i++,o+=2){const c=Math.max(-1,Math.min(1,s[i]));v.setInt16(o,c<0?c*0x8000:c*0x7FFF,true);}
        return buf;
    }

    // ==================== 动作 ====================
    function animate(dur,onFrame,onDone){animating=true;const s=performance.now();(function f(now){const t=Math.min((now-s)/dur,1);onFrame(t);t<1?requestAnimationFrame(f):(onDone?.(),animating=false);})(s);}
    function bounceAction(){if(!model)return;const oy=model.y,osx=model.scale.x,osy=model.scale.y;animate(500,t=>{const b=Math.abs(Math.sin(t*Math.PI*2.5))*(1-t);model.y=oy-b*40*DPR;const sq=1+Math.max(0,(1-b*3))*0.08*(1-t);model.scale.set(osx*sq,osy/sq);},()=>{model.y=oy;model.scale.set(osx,osy);});}
    function shakeAction(){if(!model)return;const or=model.rotation;animate(400,t=>{model.rotation=or+Math.sin(t*Math.PI*6)*0.12*(1-t);},()=>{model.rotation=or;});}
    function rollAction(){if(!model)return;const or=model.rotation;animate(700,t=>{const e=t<0.5?2*t*t:-1+(4-2*t)*t;model.rotation=or+e*Math.PI*2;},()=>{model.rotation=or;});}
    function doAction(name){if(animating)return;hideCtxMenu();({bounce:bounceAction,shake:shakeAction,roll:rollAction,purr:purrAction})[name]();}

    // ==================== Phase 2.1：闲置行为状态机 ====================
    let idleTimer = null;
    let lastIdleAction = '';
    let lastInteractionTime = Date.now();

    function recordInteraction() { lastInteractionTime = Date.now(); }

    const IDLE_ACTIONS = [
        { name: 'breathe', weight: 30, action: breatheAction },
        { name: 'purr', weight: 30, action: purrAction },
        { name: 'lookAround', weight: 25, action: lookAroundAction },
        { name: 'yawn', weight: 15, action: yawnAction },
    ];

    function getTimeAdjustedWeights() {
        const hour = new Date().getHours();
        const weights = IDLE_ACTIONS.map(a => ({ ...a }));
        // 深夜多打哈欠
        if (hour >= 22 || hour < 6) {
            const yawn = weights.find(w => w.name === 'yawn');
            if (yawn) yawn.weight = 40;
        }
        // 情绪影响动作选择
        const moodState = getMoodState();
        if (moodState === 'happy') {
            // 开心时多张望少哈欠
            const look = weights.find(w => w.name === 'lookAround');
            if (look) look.weight += 15;
        } else if (moodState === 'lonely') {
            // 孤独时多哈欠
            const yawn = weights.find(w => w.name === 'yawn');
            if (yawn) yawn.weight += 15;
        }
        // 降低刚做过的动作权重
        const last = weights.find(w => w.name === lastIdleAction);
        if (last) last.weight = Math.max(5, last.weight * 0.3);
        return weights;
    }

    function pickIdleAction() {
        const weights = getTimeAdjustedWeights();
        const total = weights.reduce((s, w) => s + w.weight, 0);
        let r = Math.random() * total;
        for (const w of weights) {
            r -= w.weight;
            if (r <= 0) return w;
        }
        return weights[0];
    }

    function startIdleBehavior() {
        scheduleNextIdle();
    }

    function scheduleNextIdle() {
        clearTimeout(idleTimer);
        const delay = 20000 + Math.random() * 30000; // 20-50秒
        idleTimer = setTimeout(() => {
            if (!animating && !chatBusy) {
                const action = pickIdleAction();
                lastIdleAction = action.name;
                action.action();
            }
            changeMood(-1); // 情绪随时间缓慢衰减
            scheduleNextIdle();
        }, delay);
    }

    // 呼吸 — scale 缓慢波动
    function breatheAction() {
        if (!model || animating) return;
        const osx = model.scale.x, osy = model.scale.y;
        animate(2000, t => {
            const wave = Math.sin(t * Math.PI * 2) * 0.02;
            model.scale.set(osx * (1 + wave), osy * (1 + wave * 0.5));
        }, () => { model.scale.set(osx, osy); });
    }

    // 左右张望
    function lookAroundAction() {
        if (!model || animating) return;
        const ox = model.x;
        animate(1500, t => {
            const offset = Math.sin(t * Math.PI * 3) * 8 * DPR * (1 - t * 0.5);
            model.x = ox + offset;
        }, () => { model.x = ox; });
    }

    // 打哈欠 — 纵向拉伸 + 回弹
    function yawnAction() {
        if (!model || animating) return;
        const osx = model.scale.x, osy = model.scale.y;
        animate(1800, t => {
            let stretchY, squashX;
            if (t < 0.3) {
                // 张嘴伸展
                const p = t / 0.3;
                stretchY = 1 + p * 0.06;
                squashX = 1 - p * 0.03;
            } else if (t < 0.7) {
                // 保持
                stretchY = 1.06;
                squashX = 0.97;
            } else {
                // 回弹
                const p = (t - 0.7) / 0.3;
                stretchY = 1.06 - p * 0.06;
                squashX = 0.97 + p * 0.03;
            }
            model.scale.set(osx * squashX, osy * stretchY);
        }, () => { model.scale.set(osx, osy); });
    }

    // 呼噜 — 呼吸动画 + 呼噜声 + z Z Z 浮动
    function purrAction() {
        if (!model || animating) return;
        playPurr();
        const osx = model.scale.x, osy = model.scale.y;
        // z Z Z 浮动效果
        const zContainer = new PIXI.Container();
        pixiApp.stage.addChild(zContainer);
        const zChars = ['z', 'Z', 'z'];
        const zTexts = [];
        zChars.forEach((ch, i) => {
            const sz = (12 + i * 5) * DPR;
            const zt = new PIXI.Text(ch, {
                fontFamily: '"PingFang SC", sans-serif',
                fontSize: sz, fontWeight: '700',
                fill: '#7c3aed',
            });
            zt.anchor.set(0.5);
            zt.alpha = 0;
            zt._delay = i * 0.25; // 依次出现
            zt._startX = model.x + (30 + i * 18) * DPR;
            zt._startY = model.y - 40 * DPR;
            zt.x = zt._startX;
            zt.y = zt._startY;
            zContainer.addChild(zt);
            zTexts.push(zt);
        });
        animate(8000, t => {
            const wave = Math.sin(t * Math.PI * 8) * 0.015;
            model.scale.set(osx * (1 + wave), osy * (1 + wave * 0.6));
            // z Z Z 循环浮动（每轮 ~3.5 秒）
            zTexts.forEach(zt => {
                const cycle = 0.44; // 每轮占总时长比例
                const loopT = (t % cycle) / cycle; // 0~1 循环
                const delayed = Math.max(0, Math.min(1, (loopT - zt._delay) / (1 - zt._delay)));
                if (delayed <= 0) { zt.alpha = 0; return; }
                // 最后 10% 总时长整体淡出
                const fadeOut = t > 0.9 ? (1 - t) / 0.1 : 1;
                zt.alpha = (delayed < 0.15 ? delayed / 0.15 : delayed > 0.75 ? (1 - delayed) / 0.25 : 1) * fadeOut;
                zt.y = zt._startY - delayed * 60 * DPR;
                zt.x = zt._startX + Math.sin(delayed * Math.PI * 2) * 5 * DPR;
            });
        }, () => {
            model.scale.set(osx, osy);
            pixiApp.stage.removeChild(zContainer);
            zContainer.destroy({ children: true });
        });
    }

    // ==================== Phase 2.2：主动问候系统 ====================

    function showGreeting() {
        const hour = new Date().getHours();
        let greeting;
        if (hour >= 5 && hour < 9) greeting = '早上好主人！新的一天喵~';
        else if (hour >= 9 && hour < 12) greeting = '上午好！今天也要加油喵~';
        else if (hour >= 12 && hour < 14) greeting = '中午好！该吃饭了喵~';
        else if (hour >= 14 && hour < 18) greeting = '下午好！继续努力喵~';
        else if (hour >= 18 && hour < 22) greeting = '晚上好主人！辛苦了喵~';
        else greeting = '深夜了还不睡喵？注意身体~';

        // 每日首次特殊问候
        const today = new Date().toDateString();
        const lastGreetDay = localStorage.getItem('pet_last_greet_day');
        if (lastGreetDay !== today) {
            localStorage.setItem('pet_last_greet_day', today);
            greeting = '今天第一次见面喵！' + greeting;
        }

        // 延迟 1.5 秒后显示（等模型加载完）
        setTimeout(() => {

        // 启动无交互提醒
        startReminderLoop();

    const REMINDERS = [
        '记得喝水喵~',
        '休息一下眼睛喵~',
        '站起来动一动喵~',
        '深呼吸放松一下喵~',
        '别忘了吃水果喵~',
    ];
    let lastReminderIdx = -1;

    function startReminderLoop() {
        clearInterval(reminderTimer);
        reminderTimer = setInterval(() => {
            const idle = Date.now() - lastInteractionTime;
            if (idle > 30 * 60 * 1000 && !chatBusy) {
                // 超过30分钟无交互
                let idx;
                do { idx = Math.floor(Math.random() * REMINDERS.length); } while (idx === lastReminderIdx);
                lastReminderIdx = idx;
                showBubble(REMINDERS[idx]);
                if (!animating) bounceAction();
                playMeow();
            }
        }, 5 * 60 * 1000); // 每5分钟检查一次
    }

    init();
    </script>
</body>
</html>
